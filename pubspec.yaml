name: flutter_svga_easyplayer
description: "Play SVGA animations in Flutter with one widget: disk and memory caching, precaching, sound, typed errors and loading states built in."
version: 0.2.0

homepage: https://github.com/zamansheikh/flutter_svga_easyplayer
repository: https://github.com/zamansheikh/flutter_svga_easyplayer

environment:
  sdk: ^3.8.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  archive: ^4.0.9
  http: ^1.6.0
  meta: ^1.15.0
  audioplayers: ^6.6.0
  path_provider: ^2.1.5
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  lints: ^6.1.0
